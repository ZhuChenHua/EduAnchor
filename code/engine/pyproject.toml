[project]
name = "eduanchor-engine"
version = "0.1.0"
description = "EduAnchor: offline textbook-grounded multi-agent interpretation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
models = [
    "FlagEmbedding>=1.3",
    "torch>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
eduanchor = "eduanchor.cli:main"
eduanchor-rpc = "eduanchor.rpc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eduanchor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
